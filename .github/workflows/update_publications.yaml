name: Update Faculty Publications

on:
  workflow_dispatch:
    inputs:
      fetch_mode:
        description: "Mode: incremental or full"
        required: false
        default: "incremental"
        type: choice
        options:
          - incremental
          - full
      batch_size:
        description: "Faculty entries to process in this run"
        required: false
        default: "20"
        type: string
      incremental_years:
        description: "Years window for incremental mode"
        required: false
        default: "2"
        type: string
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 3 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate project structure
        env:
          VALIDATE_ALLOW_MISSING: "1"
        run: |
          python -m py_compile scripts/fetch_publications.py scripts/validate_site.py
          python scripts/validate_site.py

      - name: Validate API key presence
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
        run: |
          if [ -z "${ELSEVIER_API_KEY}" ]; then
            echo "::error::ELSEVIER_API_KEY is missing. Configure this repository secret before running updates."
            exit 1
          fi

      - name: Set fetch configuration
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "FETCH_MODE=${{ inputs.fetch_mode }}" >> "$GITHUB_ENV"
            echo "BATCH_SIZE=${{ inputs.batch_size }}" >> "$GITHUB_ENV"
            echo "INCREMENTAL_YEARS=${{ inputs.incremental_years }}" >> "$GITHUB_ENV"
          else
            if [ "${{ github.event.schedule }}" = "0 3 * * 0" ]; then
              echo "FETCH_MODE=full" >> "$GITHUB_ENV"
            else
              echo "FETCH_MODE=incremental" >> "$GITHUB_ENV"
            fi
            echo "BATCH_SIZE=20" >> "$GITHUB_ENV"
            echo "INCREMENTAL_YEARS=2" >> "$GITHUB_ENV"
          fi

      - name: Fetch publications
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FACULTY_SHEET_IDS_JSON: ${{ secrets.FACULTY_SHEET_IDS_JSON }}
          FETCH_MODE: ${{ env.FETCH_MODE }}
          BATCH_SIZE: ${{ env.BATCH_SIZE }}
          INCREMENTAL_YEARS: ${{ env.INCREMENTAL_YEARS }}
        run: python scripts/fetch_publications.py

      - name: Validate generated data
        env:
          VALIDATE_ALLOW_MISSING: "1"
        run: python scripts/validate_site.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --staged --quiet; then
            git commit -m "Update faculty publications"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Write success summary
        if: success()
        run: |
          {
            echo "## Faculty Publications Update"
            echo ""
            echo "Status: Success"
            echo ""
            echo "- Repository: ${{ github.repository }}"
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Run ID: ${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Triggered by: ${{ github.actor }}"
            echo ""
            echo "Run URL:"
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write failure summary
        if: failure()
        run: |
          {
            echo "## Faculty Publications Update Failed"
            echo ""
            echo "One or more steps failed."
            echo ""
            echo "- Repository: ${{ github.repository }}"
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Run ID: ${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Triggered by: ${{ github.actor }}"
            echo ""
            echo "Open the failed run:"
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Check the failed step logs in this run."
          } >> "$GITHUB_STEP_SUMMARY"
