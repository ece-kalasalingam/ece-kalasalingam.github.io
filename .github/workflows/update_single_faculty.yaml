name: Update Single Faculty Profile

on:
  workflow_dispatch:
    inputs:
      faculty_slug:
        description: "Faculty slug from faculty.json (example: jeyaprakashk)"
        required: true
        type: string
      fetch_mode:
        description: "Mode: incremental or full"
        required: false
        default: "incremental"
        type: choice
        options:
          - incremental
          - full
      incremental_years:
        description: "Years window for incremental mode"
        required: false
        default: "2"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-single-faculty:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate project structure
        env:
          VALIDATE_ALLOW_MISSING: "1"
        run: |
          python -m py_compile scripts/fetch_publications.py scripts/validate_site.py
          python scripts/validate_site.py

      - name: Validate API key presence
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "${ELSEVIER_API_KEY}" ]; then
            echo "::error::ELSEVIER_API_KEY is missing. Configure this repository secret before running updates."
            exit 1
          fi
          if [ -z "${GOOGLE_API_KEY}" ]; then
            echo "::error::GOOGLE_API_KEY is missing. Configure this repository secret before running updates."
            exit 1
          fi

      - name: Validate selected faculty slug
        env:
          FACULTY_SLUG: ${{ inputs.faculty_slug }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          slug = os.getenv("FACULTY_SLUG", "").strip()
          if not slug:
              raise SystemExit("faculty_slug input is required.")

          faculty = json.loads(Path("faculty.json").read_text(encoding="utf-8"))
          valid_slugs = {str(item.get("slug", "")).strip() for item in faculty if isinstance(item, dict)}
          valid_slugs.discard("")

          if slug not in valid_slugs:
              raise SystemExit(f"Unknown faculty_slug: {slug}")

          print(f"Selected faculty slug is valid: {slug}")
          PY

      - name: Validate FACULTY_SHEET_IDS_JSON (optional)
        env:
          FACULTY_SHEET_IDS_JSON: ${{ secrets.FACULTY_SHEET_IDS_JSON }}
        run: |
          if [ -z "${FACULTY_SHEET_IDS_JSON}" ]; then
            echo "FACULTY_SHEET_IDS_JSON is not set. Continuing without sheet mapping."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          faculty = json.loads(Path("faculty.json").read_text(encoding="utf-8"))
          valid_slugs = {str(item.get("slug", "")).strip() for item in faculty if isinstance(item, dict)}
          valid_slugs.discard("")

          secret_value = os.getenv("FACULTY_SHEET_IDS_JSON", "").strip()
          raw = json.loads(secret_value)
          if not isinstance(raw, dict):
              raise SystemExit("FACULTY_SHEET_IDS_JSON must be a JSON object of slug -> sheet_id")

          for slug, sheet_id in raw.items():
              if not isinstance(slug, str) or not slug.strip():
                  raise SystemExit("FACULTY_SHEET_IDS_JSON contains an empty/invalid slug key")
              if slug not in valid_slugs:
                  raise SystemExit(f"FACULTY_SHEET_IDS_JSON contains unknown slug: {slug}")
              if not isinstance(sheet_id, str) or not sheet_id.strip():
                  raise SystemExit(f"FACULTY_SHEET_IDS_JSON contains empty sheet id for slug: {slug}")

          print("FACULTY_SHEET_IDS_JSON validation passed.")
          PY

      - name: Fetch single faculty data
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FACULTY_SHEET_IDS_JSON: ${{ secrets.FACULTY_SHEET_IDS_JSON }}
          FACULTY_SLUG: ${{ inputs.faculty_slug }}
          FETCH_MODE: ${{ inputs.fetch_mode }}
          BATCH_SIZE: "1"
          INCREMENTAL_YEARS: ${{ inputs.incremental_years }}
        run: python scripts/fetch_publications.py

      - name: Validate generated data
        env:
          VALIDATE_ALLOW_MISSING: "1"
        run: python scripts/validate_site.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --staged --quiet; then
            git commit -m "Update faculty data for ${{ inputs.faculty_slug }}"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
