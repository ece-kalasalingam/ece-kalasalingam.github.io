<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ECE Faculty Publications</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 30px auto; padding: 0 16px; line-height: 1.5; }
    h1, h2 { color: #1a1a1a; }
    .faculty { border: 1px solid #ddd; padding: 16px; margin-bottom: 20px; border-radius: 8px; }
    .pub { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #eee; }
    .meta { color: #555; font-size: 0.95em; }
  </style>
</head>
<body>
  <h1>ECE Faculty Publications</h1>
  <div id="content">Loading...</div>

  <script>
    async function loadFacultyList() {
      const facultyRes = await fetch("faculty.json");
      const faculty = await facultyRes.json();

      const container = document.getElementById("content");
      container.innerHTML = "";

      for (const person of faculty) {
        const res = await fetch(`data/${person.slug}.json`);
        if (!res.ok) continue;

        const data = await res.json();

        const box = document.createElement("div");
        box.className = "faculty";

        const heading = document.createElement("h2");
        heading.textContent = `${data.name} (${data.total_publications})`;

        box.appendChild(heading);

        for (const pub of data.publications) {
          const div = document.createElement("div");
          div.className = "pub";

          div.innerHTML = `
            <strong>${pub.title}</strong><br>
            <span class="meta">
              ${pub.source || "Unknown source"} |
              ${pub.date || "No date"} |
              Citations: ${pub.citations}
              ${pub.doi ? `| DOI: ${pub.doi}` : ""}
            </span>
          `;
          box.appendChild(div);
        }

        container.appendChild(box);
      }
    }

    loadFacultyList().catch(err => {
      document.getElementById("content").textContent = "Failed to load publications.";
      console.error(err);
    });
  </script>
</body>
</html>
