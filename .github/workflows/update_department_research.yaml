name: Update Department Research

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate script
        run: python -m py_compile scripts/fetch_research.py

      - name: Validate API key presence
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
        run: |
          if [ -z "${ELSEVIER_API_KEY}" ]; then
            echo "::error::ELSEVIER_API_KEY is missing. Configure this repository secret before running updates."
            exit 1
          fi

      - name: Fetch department research
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
        run: python scripts/fetch_research.py

      - name: Commit updated research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research.json
          if ! git diff --staged --quiet; then
            git commit -m "Update department research data"
            git push
          else
            echo "No changes to commit"
          fi
